name: Release
on:
  # 只手动触发：Actions 页面 → Release → Run workflow，填版本号（如 v1.0.2）
  # tag 不存在：在所选分支最新提交上创建 tag 并发布；tag 已存在：重新构建该 tag 并更新 Release
  workflow_dispatch:
    inputs:
      version:
        description: "版本号，如 v1.0.2"
        required: true
        type: string
env:
  CI_NAME: Release CI
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      # 只编 arm64-v8a，native 编译时间约为 4 个架构时的 1/4
      BUILD_ABI: arm64-v8a
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Create or checkout tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "版本号格式不对：$VERSION（应为 v1.0.2 这种）" >&2
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
            echo "tag $VERSION 已存在，重新构建该 tag"
            git checkout -q "$VERSION"
            git submodule update --init --recursive
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag "$VERSION"
            git push origin "$VERSION"
          fi

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: 17
          # will restore cache of dependencies and wrappers
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android NDK
        run: |
          sdkmanager --install "cmake;3.31.6"

      - name: Calculate JNI cache hash
        id: cache-hash
        run: |
            ./gradlew :app:calculateNativeCacheHash

      - name: Fetch JNI cache
        uses: actions/cache@v5
        id: jni-cache
        with:
          path: "app/prebuilt"
          key: ${{ runner.os }}-trime-jni-release-${{ env.BUILD_ABI }}-${{ steps.cache-hash.outputs.native-cache-hash }}

      - name: Setup Keystore
        run: |
          cat << EOF > keystore.properties
          keyBase64=${{ secrets.SIGNING_KEY }}
          storePassword=${{ secrets.KEY_STORE_PASSWORD }}
          keyAlias=${{ secrets.ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Prebuild Rime data
        # 在 CI 上预先编译词库并打包进 APK，装完不用等部署（见 script/prebuild-rime-data.sh）
        run: |
          sudo apt-get update
          sudo apt-get install -y libboost-regex-dev
          script/prebuild-rime-data.sh

      - name: Build Trime
        run: make release

      - name: Add JNI cache
        if: ${{ !steps.jni-cache.outputs.cache-hit }}
        run: cp -R app/build/intermediates/merged_native_libs/release/mergeReleaseNativeLibs/out/lib app/prebuilt

      - name: Build changelog
        id: build_changelog
        uses: mikepenz/release-changelog-builder-action@v4
        with:
          commitMode: true
          toTag: ${{ inputs.version }}
          ignorePreReleases: true
          configurationJson: |
            {
              "template": "Change log from #{{FROM_TAG}} to #{{TO_TAG}}: #{{RELEASE_DIFF}}\n#{{UNCATEGORIZED}}",
              "pr_template": "- [#{{MERGE_SHA}}] - #{{TITLE}}"
            }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Stable release
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          tag: ${{ inputs.version }}
          prerelease: ${{ contains(inputs.version, 'alpha') || contains(inputs.version, 'beta') }}
          artifacts: "app/build/outputs/apk/release/*.apk"
          body: |
            ${{ steps.build_changelog.outputs.changelog }}
          token: ${{ secrets.GITHUB_TOKEN }}
